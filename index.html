<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vale Morto</title>
<meta name="description" content="Sobrevivência zumbi no navegador: saqueie, barrique, cure seus ferimentos e dure o máximo possível.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230b0d10'/%3E%3Ccircle cx='16' cy='14' r='8' fill='%237d8a6c'/%3E%3Crect x='11' y='12' width='3' height='3' fill='%235c0e0c'/%3E%3Crect x='18' y='12' width='3' height='3' fill='%235c0e0c'/%3E%3Crect x='12' y='24' width='8' height='3' fill='%23d8b25a'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Special+Elite&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=202610080040">
</head>
<body>
<canvas id="game"></canvas>
<div id="hud" class="hidden">
  <div id="topleft">
    <div id="clock"></div>
    <div class="bars">
      <div class="bar"><span>Saúde</span><div><i id="hpbar"></i></div></div>
      <div class="bar"><span>Fôlego</span><div><i id="stbar" class="st"></i></div></div>
    </div>
    <div id="place"></div>
    <div id="moodles"></div>
  </div>
  <div id="equip"></div>
  <div id="log"></div>
  <div id="hint"></div>
  <div id="hotbar"></div>
  <canvas id="minimap" width="184" height="184"></canvas>
  <div id="shortcuts"><kbd>Tab</kbd> inventário <kbd>J</kbd> saúde <kbd>O</kbd> criar <kbd>M</kbd> mapa <kbd>H</kbd> ajuda</div>
</div>
<div id="ctx" class="hidden"></div>
<div id="panel" class="panel hidden"></div>
<div id="container" class="panel hidden"></div>
<div id="mapview" class="screen hidden"><div class="card mapcard"><h2>Mapa de Vale Morto</h2><canvas id="mapcanvas"></canvas><p class="small">Só aparece o que você já viu. <kbd>M</kbd> fecha. <span id="mapcredit"></span></p></div></div>
<div id="menu" class="screen"></div>
<div id="pause" class="screen hidden"></div>
<div id="help" class="screen hidden"></div>
<div id="death" class="screen hidden"></div>
<div id="touchwarn">Vale Morto precisa de teclado e mouse. Abra em um computador.</div>
<script type="module" src="src/game.js?v=202610080040"></script>
</body>
</html>
